<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171329">
<title>Under Maintenance — AnkraiXMotion</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-color: #171329;
        --card-bg: #1e1933;
        --text-main: #f8f8f8;
        --text-muted: #a09cb0;
        --accent-warning: #facc15; /* Kuning Maintenance */
        --accent-warning-glow: rgba(250, 204, 21, 0.3);
        --accent-wa: #25D366;
        --border-color: #2d2545;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Space Grotesk', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Ambient Lights */
    .ambient {
        position: fixed;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        filter: blur(100px);
        z-index: 0;
        pointer-events: none;
        opacity: 0.3;
        animation: pulse 4s infinite alternate;
    }
    .ambient-one {
        top: -100px; left: -100px;
        background: radial-gradient(circle, #facc15 0%, transparent 70%);
    }
    .ambient-two {
        bottom: -100px; right: -100px;
        background: radial-gradient(circle, #5e17eb 0%, transparent 70%);
    }

    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.2; }
        100% { transform: scale(1.2); opacity: 0.5; }
    }

    .page-shell {
        width: 100%;
        max-width: 450px;
        padding: 24px;
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    /* Header */
    .site-header {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 10px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--text-main);
        font-weight: 700;
        font-size: 1.2rem;
    }

    .brand-mark {
        background: var(--accent-warning);
        color: #171329;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        font-weight: 800;
        box-shadow: 0 0 15px var(--accent-warning-glow);
    }

    .brand-name span { color: var(--accent-warning); }

    /* Maintenance Card */
    .maintenance-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(250, 204, 21, 0.05);
        position: relative;
        overflow: hidden;
    }

    /* Efek Pita Garis-garis Peringatan */
    .maintenance-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 6px;
        background: repeating-linear-gradient(-45deg, #facc15, #facc15 10px, #171329 10px, #171329 20px);
    }

    .icon-container {
        width: 100px;
        height: 100px;
        background: rgba(250, 204, 21, 0.1);
        border: 2px dashed var(--accent-warning);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
        font-size: 3rem;
        color: var(--accent-warning);
        animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .gear-spin {
        animation: spin 4s linear infinite;
    }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 12px;
        color: white;
        line-height: 1.2;
    }

    .title span {
        color: var(--accent-warning);
    }

    .description {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 24px;
    }

    .description b {
        color: #f8f8f8;
    }

    /* Status Box */
    .status-box {
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 0.85rem;
        color: var(--accent-warning);
        font-weight: 600;
    }

    .status-dot {
        width: 10px;
        height: 10px;
        background: var(--accent-warning);
        border-radius: 50%;
        animation: blink 1s infinite alternate;
    }

    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.2; } }

    /* WA Button */
    .wa-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: var(--accent-wa);
        color: #111;
        padding: 16px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        font-size: 1rem;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
    }

    .wa-button:hover {
        background: #20b858;
        transform: translateY(-2px);
        box-shadow: 0 12px 25px rgba(37, 211, 102, 0.4);
    }

    .wa-button i {
        font-size: 1.3rem;
    }

    /* Footer */
    .site-footer {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.8rem;
        margin-top: 10px;
    }
</style>
</head>
<body>
<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<main class="page-shell">
    <header class="site-header">
        <a class="brand" href="./" aria-label="AnkraiXMotion beranda">
            <span class="brand-mark">AX</span>
            <span class="brand-name">Ankrai<span>X</span>Motion</span>
        </a>
    </header>

    <section class="maintenance-card">
        <div class="icon-container">
            <i class="fa-solid fa-gear gear-spin"></i>
        </div>

        <h1 class="title">Website Sedang<br><span>Diperbaiki.</span></h1>
        
        <p class="description">
            Mohon maaf, website saat ini sedang <i>error</i> dan admin lagi <b>mager banget</b> buat benerin sekarang. <br><br>
            Silakan cek Saluran WhatsApp di bawah buat update terbaru.
        </p>

        <div class="status-box">
            <div class="status-dot"></div>
            STATUS: DALAM PERBAIKAN
        </div>

        <!-- TOMBOL SALURAN WHATSAPP -->
        <a href="https://whatsapp.com/channel/0029VbC1J5S8kyyMKhJ1Na2w" target="_blank" rel="noopener noreferrer" class="wa-button">
            <i class="fa-brands fa-whatsapp"></i>
            Gabung Saluran WhatsApp
        </a>
    </section>

    <footer class="site-footer">
        &copy; <span id="year"></span> AnkraiXMotion. All Rights Reserved.
    </footer>
</main>

<script>
    // Set tahun otomatis
    document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
